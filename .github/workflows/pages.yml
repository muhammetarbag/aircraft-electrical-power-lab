name: Validate and publish Aircraft Electrical Power Lab

on:
  push:
    branches: [codex/aircraft-electrical-power-lab]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify simulation and educational scenarios
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Type check and build
        run: npm run build
      - name: Install browser test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test production UI
        run: |
          mkdir -p artifacts
          npm run preview -- --strictPort > artifacts/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3024/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3024/ > /dev/null
          LAB_URL=http://127.0.0.1:3024/ .venv/bin/python tests/browser_check.py
      - name: Package validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Publish validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
